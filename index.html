<style>

    --bg:#faf6f0;
    --card:#ffffff;
    --ink:#2e2520;
    --muted:#7a6c62;
    --line:#ebe2d6;
    --accent:#b5583a;
    --accent-dark:#934329;
    --radius:16px;
    --shadow:0 2px 10px rgba(60,40,25,.06);
    --shadow-hover:0 10px 28px rgba(60,40,25,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  a{color:inherit;text-decoration:none}

  /* Topo */
  header{
    background:linear-gradient(135deg,#f3e6d6 0%,#f7ece0 55%,#efd9c6 100%);
    border-bottom:1px solid var(--line);
    padding:56px 20px 44px;text-align:center;position:relative;overflow:hidden;
  }
  header::before,header::after{
    content:"";position:absolute;inset:auto;border:2px dashed rgba(181,88,58,.25);border-radius:50%;
  }
  header::before{width:260px;height:260px;left:-80px;top:-90px}
  header::after{width:200px;height:200px;right:-60px;bottom:-110px}
  .selo{display:inline-block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
  h1{font-family:"Fraunces",serif;font-weight:700;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin-bottom:12px}
  header p{color:var(--muted);max-width:560px;margin:0 auto;font-size:1.05rem}

  /* Barra de busca e filtros */
  .controles{max-width:1200px;margin:-26px auto 0;padding:0 20px;position:relative;z-index:2}
  .busca{
    display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:14px 22px;box-shadow:var(--shadow-hover);
  }
  .busca svg{flex:none;color:var(--muted)}
  .busca input{border:0;outline:0;font:inherit;font-size:1rem;width:100%;background:transparent;color:var(--ink)}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
  .filtro{
    border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;
    padding:8px 16px;border-radius:999px;cursor:pointer;transition:.2s;
  }
  .filtro:hover{border-color:var(--accent);color:var(--accent)}
  .filtro.ativo{background:var(--accent);border-color:var(--accent);color:#fff}
  .filtro .qtd{opacity:.7;font-weight:400;margin-left:4px}

  /* Abas */
  .abas{display:flex;justify-content:center;gap:6px;margin:0 auto 18px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:5px;width:max-content;box-shadow:var(--shadow)}
  .aba{border:0;background:transparent;font:inherit;font-weight:700;font-size:.95rem;color:var(--muted);
    padding:10px 22px;border-radius:999px;cursor:pointer;transition:.2s}
  .aba:hover{color:var(--accent)}
  .aba.ativa{background:var(--ink);color:#fff}

  /* Cards de vídeo */
  .grade.videos{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .thumb{aspect-ratio:16/9;position:relative;overflow:hidden;background:#e9dfd3}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .card:hover .thumb img{transform:scale(1.04)}
  .thumb .play{
    position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;
    background:rgba(181,88,58,.92);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .2s;
  }
  .card:hover .thumb .play{transform:scale(1.1)}
  .thumb .play::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
  .thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.78);color:#fff;font-size:.75rem;font-weight:700;padding:3px 7px;border-radius:6px}
  .info .canal{font-size:.8rem;color:var(--accent);font-weight:600}

  /* Grade */
  main{max-width:1200px;margin:0 auto;padding:28px 20px 70px}
  .resumo{color:var(--muted);font-size:.92rem;margin-bottom:18px}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;cursor:pointer;display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .capa{aspect-ratio:4/5;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:18px}
  .capa img,.capa svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .capa .titulo-capa{
    position:relative;font-family:"Fraunces",serif;font-weight:700;font-size:1.45rem;line-height:1.1;color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.18);

  .capa .costura{position:absolute;inset:10px;border:1.5px dashed rgba(255,255,255,.55);border-radius:10px;pointer-events:none}
  .capa .tipo{

    font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px;z-index:1;
  }
  .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
  .info h3{font-size:1rem;font-weight:700;line-height:1.3}
  .info .cat{font-size:.8rem;color:var(--muted)}

  .vazio{text-align:center;color:var(--muted);padding:60px 10px;display:none}

  /* Leitor embutido */
  .leitor{position:fixed;inset:0;background:#2b221d;display:none;flex-direction:column;z-index:50}
  .leitor.aberto{display:flex}
  .leitor-barra{
    display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);
    border-bottom:1px solid var(--line);flex:none;
  }
  .leitor-barra .titulo{flex:1;min-width:0}
  .leitor-barra .titulo small{display:block;color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
  .leitor-barra .titulo strong{display:block;font-family:"Fraunces",serif;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{
    display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:.9rem;
    padding:10px 16px;border-radius:12px;border:0;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .btn-principal{background:var(--accent);color:#fff}
  .btn-principal:hover{background:var(--accent-dark)}
  .btn-sec{background:#f0e6da;color:var(--ink)}
  .btn-sec:hover{background:#e6d8c8}
  .leitor-area{flex:1;position:relative;background:#3a302a}
  .leitor-area iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .carregando{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    color:#f3e6d6;font-weight:600;pointer-events:none;
  }
  .carregando::before{
    content:"";width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#f3e6d6;
    animation:girar .8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg)}}
  .reserva{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;
    background:rgba(43,34,29,.85);color:#f3e6d6;font-size:.82rem;padding:8px 14px;border-radius:999px;white-space:nowrap;
  }
  .reserva a{color:#fff;font-weight:700;text-decoration:underline}
  @media (max-width:640px){
    .leitor-barra .btn .txt{display:none}
    .leitor-barra .titulo strong{font-size:1rem}
  }

  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 20px;border-top:1px solid var(--line)}

  @media (max-width:640px){
    .grade{grid-template-columns:repeat(2,1fr);gap:14px}
    .grade.videos{grid-template-columns:1fr}
    .aba{padding:9px 16px;font-size:.9rem}
    .capa .titulo-capa{font-size:1.1rem}
  }
</style>
</head>

function escurecer(hex, f=.72){
  const n = parseInt(hex.slice(1),16);
  const c = [n>>16, n>>8&255, n&255].map(v=>Math.round(v*f));
  return `rgb(${c.join(",")})`;
}
function hash(t){ let h=0; for(const ch of t) h=(h*31+ch.charCodeAt(0))>>>0; return h; }

function formaDe(item){
  if(item.forma) return item.forma;
  const t = normalizar(item.titulo);
  const regras = [
    ["mochila","mochila"],["necessaire","necessaire"],["guia|manual|transforme","guia"],
    ["macacao","bolso"],["transversal","transversal"],["carteir","carteiro"],["hobo","hobo"],
    ["cilindrica","cilindrica"],["clutch","clutch"],["bucket","bucket"],["saco|sacola","sacola"],
    ["tote|bag","tote"]
  ];
  for(const [re,f] of regras) if(new RegExp(re).test(t)) return f;
  const variadas = ["tote","transversal","hobo","carteiro","bucket","clutch","sacola"];
  return variadas[hash(item.titulo) % variadas.length];
}

function padraoTecido(tipo, id){
  if(tipo==="jeans") return `<pattern id="t${id}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#fff" stroke-opacity=".13" stroke-width="1.6"/></pattern>`;
  if(tipo==="bolinhas") return `<pattern id="t${id}" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#fff" fill-opacity=".35"/><circle cx="9" cy="9" r="1.4" fill="#fff" fill-opacity=".35"/></pattern>`;
  if(tipo==="flores") return `<pattern id="t${id}" width="18" height="18" patternUnits="userSpaceOnUse">
      <g fill="#fff" fill-opacity=".4"><circle cx="5" cy="3" r="1.6"/><circle cx="5" cy="7" r="1.6"/><circle cx="3" cy="5" r="1.6"/><circle cx="7" cy="5" r="1.6"/></g>
      <circle cx="5" cy="5" r="1.2" fill="${OURO}"/><circle cx="14" cy="14" r="1.3" fill="#fff" fill-opacity=".3"/></pattern>`;
  return `<pattern id="t${id}" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="9" x2="10" y2="9" stroke="#fff" stroke-opacity=".12" stroke-width="1"/></pattern>`;
}

function quebrarTitulo(t, max=19){
  const linhas=[""];
  t.split(" ").forEach(p=>{
    const atual = linhas[linhas.length-1];
    if((atual+" "+p).trim().length > max && atual) linhas.push(p);
    else linhas[linhas.length-1] = (atual+" "+p).trim();
  });
  return linhas.slice(0,3);
}

let contadorCapa = 0;
function capaSVG(item){
  const id = ++contadorCapa;
  const tema = TEMAS[item.categoria] || TEMAS["Bolsas"];
  const h = hash(item.titulo);
  let cor = tema.cores[h % tema.cores.length];
  if(/black/i.test(item.titulo)) cor = "#3a3330";
  const D = escurecer(cor);
  const f = FORMAS[formaDe(item)](D);
  const linhas = quebrarTitulo(item.titulo);
  const fs = linhas.length===3 ? 12.5 : (linhas.some(l=>l.length>14) ? 14 : 16);
  const ys = linhas.length===1 ? [229] : linhas.length===2 ? [220, 239] : [215, 230, 245];
  const centro = "translate(100 136) scale(.88) translate(-100 -136)";

  return `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capa: ${item.titulo}">
    <defs>
      <pattern id="bg${id}" width="18" height="18" patternUnits="userSpaceOnUse">
        <path d="M7 9h4M9 7v4" stroke="${tema.faixa}" stroke-opacity=".14" stroke-width="1.2"/></pattern>
      ${padraoTecido(tema.tecido, id)}
    </defs>
    <rect width="200" height="250" fill="${tema.fundo}"/>
    <rect width="200" height="250" fill="url(#bg${id})"/>
    <circle cx="100" cy="122" r="68" fill="${tema.mancha}"/>
    <ellipse cx="100" cy="184" rx="52" ry="5" fill="#000" opacity=".08"/>
    ${f.back}
    <path d="${f.body}" fill="${cor}"/>
    <path d="${f.body}" fill="url(#t${id})"/>
    <path d="${f.body}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-dasharray="3 3" transform="${centro}"/>
    ${f.extras}
    <rect y="196" width="200" height="54" fill="${tema.faixa}"/>
    <line x1="10" y1="202" x2="190" y2="202" stroke="#fff" stroke-opacity=".35" stroke-dasharray="4 3"/>
    ${linhas.map((l,i)=>`<text x="100" y="${ys[i]}" text-anchor="middle" fill="#fff" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="${fs}">${l}</text>`).join("")}
  </svg>`;
}

function montarCapa(el, item){
  el.style.background = "";
  el.innerHTML = `
    ${item.capa ? `<img src="${item.capa}" alt="" loading="lazy">` : capaSVG(item)}
    <span class="tipo">${item.tipo}</span>
  `;
}

function renderFiltros(){
  const base  = aba==="videos" ? VIDEOS : APOSTILAS;
  const chave = aba==="videos" ? "modulo" : "categoria";
  const nomes = ["Todas", ...(aba==="videos" ? MODULOS : Object.keys(CATEGORIAS))];
  $("#filtros").innerHTML = nomes.map(n=>{
    const qtd = n==="Todas" ? base.length : base.filter(a=>a[chave]===n).length;
    return `<button class="filtro ${n===filtroAtual?"ativo":""}" data-cat="${n}">${n}<span class="qtd">${qtd}</span></button>`;
  }).join("");
}

function renderGrade(){
  if(aba==="videos") return renderVideos();
  const lista = APOSTILAS.filter(a =>
    (filtroAtual==="Todas" || a.categoria===filtroAtual) &&
    normalizar(a.titulo + " " + a.categoria).includes(normalizar(termo))
  );
  const grade = $("#grade");
  grade.className = "grade";
  grade.innerHTML = "";
  lista.forEach(item=>{
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `<div class="capa"></div><div class="info"><h3>${item.titulo}</h3><span class="cat">${item.categoria}</span></div>`;
    montarCapa(card.querySelector(".capa"), item);
    card.addEventListener("click", ()=>abrirLeitor(item));
    grade.appendChild(card);
  });
  $("#vazio").style.display = lista.length ? "none" : "block";
  $("#resumo").textContent = `${lista.length} ${lista.length===1?"apostila":"apostilas"}`;
}

function renderVideos(){
  const lista = VIDEOS.filter(v =>
    (filtroAtual==="Todas" || v.modulo===filtroAtual) &&
    normalizar(v.titulo + " " + v.modulo + " " + v.canal).includes(normalizar(termo))
  );
  const grade = $("#grade");
  grade.className = "grade videos";
  grade.innerHTML = "";
  lista.forEach(v=>{
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="thumb">
        <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span class="play"></span>
        ${v.duracao ? `<span class="dur">${v.duracao}</span>` : ""}
      </div>
      <div class="info"><span class="cat">${v.modulo}</span><h3>${v.titulo}</h3><span class="canal">${v.canal}</span></div>`;
    card.addEventListener("click", ()=>abrirVideo(v));
    grade.appendChild(card);
  });
  $("#vazio").style.display = lista.length ? "none" : "block";
  $("#resumo").textContent = `${lista.length} ${lista.length===1?"videoaula":"videoaulas"}`;
}

function trocarAba(nova){
  if(nova===aba) return;
  aba = nova; filtroAtual = "Todas"; termo = ""; $("#busca").value = "";
  document.querySelectorAll(".aba").forEach(b=>b.classList.toggle("ativa", b.dataset.aba===aba));
  $("#busca").placeholder = aba==="videos" ? "Buscar aula… ex: zíper, mochila, iniciante" : "Buscar molde… ex: tote, mochila, carteiro";
  renderFiltros(); renderGrade();
}

function abrirVideo(v){
  $("#lCat").textContent = v.modulo + " · " + v.canal;
  $("#lTitulo").textContent = v.titulo;
  $("#lBaixar").style.display = "none";
  $("#lReservaTxt").textContent = "Não carregou?";
  $("#lReserva").textContent = "Assistir no YouTube";
  $("#lReserva").href = `https://www.youtube.com/watch?v=${v.id}`;
  $("#carregando").textContent = "Carregando aula…";
  mostrarLeitor(`https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`);
}

function mostrarLeitor(src){
  $("#carregando").style.display = "flex";
  $("#lFrame").src = src;
  $("#leitor").classList.add("aberto");
  document.body.style.overflow = "hidden";
  history.pushState({leitor:true}, "");
}

function abrirLeitor(item){
  $("#lCat").textContent = item.categoria;
  $("#lTitulo").textContent = item.titulo;
  $("#lBaixar").href = item.download || item.link;
  $("#lBaixar").style.display = "";
  $("#lReservaTxt").textContent = "Não apareceu?";
  $("#lReserva").textContent = "Abrir em nova aba";
  $("#lReserva").href = item.link;
  $("#carregando").textContent = "Carregando apostila…";
  mostrarLeitor(item.driveId ? `https://drive.google.com/file/d/${item.driveId}/preview` : item.link);
}
function fecharLeitor(viaHistorico){
  if(!$("#leitor").classList.contains("aberto")) return;
  $("#leitor").classList.remove("aberto");
  $("#lFrame").src = "about:blank";
  document.body.style.overflow = "";
  if(!viaHistorico) history.back();
}
$("#lFrame").addEventListener("load", ()=>{ $("#carregando").style.display = "none"; });

$("#filtros").addEventListener("click", e=>{
  const b = e.target.closest(".filtro");
  if(!b) return;
  filtroAtual = b.dataset.cat;
  renderFiltros(); renderGrade();
});
document.querySelector(".abas").addEventListener("click", e=>{
  const b = e.target.closest(".aba"); if(b) trocarAba(b.dataset.aba);
});
$("#busca").addEventListener("input", e=>{ termo = e.target.value; renderGrade(); });
$("#voltar").addEventListener("click", ()=>fecharLeitor(false));
document.addEventListener("keydown", e=>{ if(e.key==="Escape") fecharLeitor(false); });
window.addEventListener("popstate", ()=>fecharLeitor(true)); // botão voltar do celular fecha o leitor

renderFiltros();
renderGrade();
</script>
